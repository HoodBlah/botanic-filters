Lets Create's List, Attribute and Package filters be used in Botania Revived's Corporea Funnel and Hopperhock.
Place a Create filter in an item frame on the funnel and the funnel requests items matching the filter;
the same frames on a Hopperhock decide which dropped items it picks up.
'''
