plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.king.botanicfilters'
version = '1.0.0'

base {
    archivesName = 'botanicfilters-1.21.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.240'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        botanicfilters {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Create 6.0.10 for 1.21.1, plus the pieces its slim jar leaves out.
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    implementation('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    implementation('dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6') { transitive = false }
    implementation('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67') { transitive = false }

    // Botania Revived (CurseForge only) and its required dependency.
    implementation('curse.maven:botania-revived-1725641:9577651') { transitive = false }
    implementation('vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE') { transitive = false }
}
