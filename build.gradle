import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

group = 'com.king.botanicfilters'
version = '1.0.0'

base {
    archivesName = 'botanicfilters-1.21.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.240'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        botanicfilters {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Create 6.0.10 for 1.21.1, plus the pieces its slim jar leaves out.
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') { transitive = false }
    implementation('net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1') { transitive = false }
    implementation('dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6') { transitive = false }
    implementation('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67') { transitive = false }

    // Botania Revived (CurseForge only) and its required dependency.
    implementation('curse.maven:botania-revived-1725641:9577651') { transitive = false }
    implementation('vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE') { transitive = false }
}

// ./gradlew curseforge -- uploads the jar; needs CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID.
def cfToken = System.getenv('CURSEFORGE_TOKEN')
def cfProjectId = System.getenv('CURSEFORGE_PROJECT_ID')

if (cfToken && cfProjectId) {
    tasks.register('curseforge', TaskPublishCurseForge) {
        group = 'publishing'
        description = 'Uploads the built jar to CurseForge.'
        apiToken = cfToken
        disableVersionDetection()

        def mainFile = upload(cfProjectId, tasks.named('jar').flatMap { it.archiveFile })
        mainFile.displayName = "Botanic Filters ${project.version} (1.21.1 NeoForge)"
        mainFile.releaseType = 'release'
        mainFile.changelogType = 'markdown'
        mainFile.changelog = '''
Create filters now also work in the Hopperhock.

The Hopperhock reads Create's List, Attribute and Package filters from its item frames and only picks up the items they match (respecting blacklist mode), so the same filters drive both the Corporea Funnel and Hopperhock pickup.

Requires Create 6.0.10+ and Botania Revived 2.0.2+ on Minecraft 1.21.1 (NeoForge).
'''
        mainFile.addGameVersion('1.21.1')
        mainFile.addModLoader('NeoForge')
        mainFile.addJavaVersion('Java 21')
        mainFile.addRequirement('create')
        mainFile.addRequirement('botania')
    }
} else {
    tasks.register('curseforge') {
        group = 'publishing'
        description = 'Uploads the built jar to CurseForge (needs CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID).'
        doFirst {
            throw new GradleException('Set the CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID environment variables to upload.')
        }
    }
}
